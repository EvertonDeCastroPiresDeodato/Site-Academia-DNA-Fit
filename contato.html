        <!-- título da página -->
        <section>
            <h1>Contato</h1>
            <p>Entre em contato com a Academia DNA Fit para saber mais sobre nossos serviços e planos.</p>
        </section>

        <!-- formulário de contato -->
        <section>
            <h2>Envie sua mensagem</h2>

            <form action="enviar.html" method="get">

                <label for="nome">Nome:</label><br>
                <input type="text" id="nome" name="nome" required><br><br>

                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email" required><br><br>

                <label for="mensagem">Mensagem:</label><br>
                <textarea id="mensagem" name="mensagem" rows="5" cols="40" required></textarea><br><br>

                <!-- botões do formulário -->
                <input type="reset" value="Limpar">
                <input type="submit" value="Enviar">

            </form>
        </section>

                src="https://www.google.com/maps?q=UNIGRAN+EAD&output=embed"

                style="border:0;"
                allowfullscreen=""
                loading="lazy">

        </section>
