<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login - DNA Fit</title>

    <!-- ligação com o css -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- menu principal do site -->
    <nav>
        <a href="index.html">Home</a>
        <a href="sobre.html">Sobre</a>
        <a href="portfolio.html">Portfólio</a>
        <a href="contato.html">Contato</a>
        <a href="login.html">Login</a>
    </nav>

    <!-- conteúdo principal -->
    <main>

        <!-- título da página -->
        <section>
            <h1>Login</h1>
            <p>Faça seu acesso na plataforma da Academia DNA Fit.</p>
        </section>

        <!-- formulário de login -->
        <section>
            <form id="formLogin" onsubmit="return validarLogin()">

                <label for="usuario">Usuário:</label><br>
                <input type="text" id="usuario" name="usuario"><br><br>

                <label for="senha">Senha:</label><br>
                <input type="password" id="senha" name="senha"><br><br>

                <label for="categoria">Categoria:</label><br>
                <select id="categoria" name="categoria">
                    <option value="">Selecione</option>
                    <option value="cliente">Cliente</option>
                    <option value="administrador">Administrador</option>
                    <option value="visitante">Visitante</option>
                </select><br><br>

                <input type="submit" value="Entrar">
                <input type="reset" value="Limpar">
            </form>
        </section>

        <!-- link para voltar -->
        <section>
            <p><a href="index.html">Voltar para Home</a></p>
        </section>

    </main>

    <!-- rodapé com dados do aluno -->
    <footer>
        <p>Everton De Castro Pires | RGM:3436461 | Polo:Porto</p>
    </footer>

    <!-- arquivo javascript externo -->
    <script src="js/validacao.js"></script>

</body>
</html>
